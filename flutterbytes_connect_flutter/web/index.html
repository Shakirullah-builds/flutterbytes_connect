<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FlutterBytes Connect AI - Real-time developer networking & AI hackathon matchmaker for FlutterBytes Conference 2026.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlutterBytes Connect AI">
  <meta name="theme-color" content="#050E1F">

  <title>FlutterBytes Connect AI · Live Engineering Wall</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Prevent any white flash while Flutter Web loads Dart / CanvasKit */
    html, body {
      background-color: #050E1F;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #050E1F;
      z-index: 999999;
      transition: opacity 0.4s ease-out;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background-color: rgba(15, 30, 56, 0.9);
      border: 1px solid #1E3A5F;
      color: #38BDF8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 24px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #38BDF8;
      box-shadow: 0 0 8px #38BDF8;
      animation: pulse 1.8s infinite;
    }

    .spinner-ring {
      position: relative;
      width: 52px;
      height: 52px;
      margin-bottom: 22px;
    }

    .spinner-ring div {
      box-sizing: border-box;
      display: block;
      position: absolute;
      width: 52px;
      height: 52px;
      border: 3px solid transparent;
      border-top-color: #2A9DF4;
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      box-shadow: 0 0 16px rgba(42, 157, 244, 0.4);
    }

    .spinner-ring div:nth-child(1) { animation-delay: -0.3s; }
    .spinner-ring div:nth-child(2) { animation-delay: -0.15s; }
    .spinner-ring div:nth-child(3) { animation-delay: 0s; }

    .loading-title {
      color: #F8FAFF;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      margin-bottom: 6px;
    }

    .loading-subtitle {
      color: #94A3B8;
      font-size: 12.5px;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.5); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Branded FlutterBytes Dark Splash Loader (Zero White Flash) -->
  <div id="app-loading">
    <div class="brand-badge">
      <span class="pulse-dot"></span>
      FLUTTERBYTES 2026
    </div>
    <div class="spinner-ring">
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="loading-title">FlutterBytes Connect AI</div>
    <div class="loading-subtitle">Initializing real-time Serverpod stream...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
